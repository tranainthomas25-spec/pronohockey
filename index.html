<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#0A1020; --surface:#111A2E; --surface2:#18233C; --line:#243150;
  --gold:#D4AF37; --gold2:#F0D27A; --gold-dim:rgba(212,175,55,.14);
  --text:#EFE8D6; --muted:#8C94AB; --win:#3FBF7F; --loss:#E2625E;
  --r:16px; --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 Barlow,system-ui,sans-serif;min-height:100%}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(var(--bg) 70%,rgba(10,16,32,.85));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand img{width:34px;height:34px;border-radius:10px}
.brand span{font:700 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase}
.brand b{color:var(--gold)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.maj{padding:0 16px 6px;color:var(--muted);font-size:12px}
main{padding:4px 16px 96px;max-width:720px;margin:0 auto}
h2{font:600 13px/1 "Barlow Condensed",sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin:22px 2px 10px}
h2:first-child{margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1A1405;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero{border-color:rgba(212,175,55,.45);background:linear-gradient(160deg,#1C2540,#111A2E 60%)}
.hero .tt{font:700 20px/1.1 "Barlow Condensed",sans-serif;color:var(--gold2)}
.hero .st{color:var(--muted);font-size:12.5px;margin:3px 0 8px}
.sec{font:600 12px "Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:12px 0 2px}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sec+.pl{border-top:0}
.pl .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .d{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pc{font:700 20px/1 "Barlow Condensed",sans-serif;color:var(--gold2);text-align:right}
.pl .co{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.inc{font-size:10.5px;font-weight:700;color:#1A1405;background:#E9A23B;border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.note{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.45}
.m{cursor:pointer}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.meta .heure{font:600 15px "Barlow Condensed",sans-serif;color:var(--gold2)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team.r{flex-direction:row-reverse;text-align:right}
.team img{width:30px;height:30px;flex:none}
.team .nm{font:700 19px/1.1 "Barlow Condensed",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .rec{font-size:11.5px;color:var(--muted)}
.vs{font:600 13px "Barlow Condensed",sans-serif;color:var(--gold);border:1px solid var(--gold-dim);background:var(--gold-dim);border-radius:8px;padding:3px 7px;white-space:nowrap}
.vs.live{color:#1A1405;background:var(--gold);font-size:17px}
.mini{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px;font-size:13.5px}
.mini div{display:flex;justify-content:space-between;gap:8px}
.mini span{color:var(--muted)}
.mini b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini i{font-style:normal;font:700 15px "Barlow Condensed",sans-serif;color:var(--gold2)}
.more{margin-top:10px;width:100%;padding:9px;border-radius:12px;border:1px dashed rgba(212,175,55,.45);color:var(--gold);font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}
.seg button{padding:9px 4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{border-color:var(--gold);color:var(--gold2);background:var(--gold-dim)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(13,20,38,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11.5px;font-weight:600}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold)}
.tabs button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.veil{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.6);display:flex;align-items:flex-end;justify-content:center}
.veil.hidden{display:none}
.sheet{width:100%;max-width:720px;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid rgba(212,175,55,.35);
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:700 22px "Barlow Condensed",sans-serif;margin-bottom:2px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11.5px Barlow;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
td{text-align:center;padding:9px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.eq,th.eq{text-align:left;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.g{font:700 16px "Barlow Condensed",sans-serif;color:var(--gold2)}
@media (min-width:760px){.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon-192.png" alt=""><span>Prono<b>Hockey</b></span></div>
  <button class="iconbtn" id="btnRefresh" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</header>
<div class="maj" id="maj"></div>
<main id="view"><p class="empty">Chargement des matchs NHL…</p></main>
<nav class="tabs" id="tabs">
  <button data-tab="top" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>Top du jour</button>
  <button data-tab="matchs"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Matchs</button>
  <button data-tab="joueurs"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Joueurs</button>
</nav>
<div class="veil hidden" id="veil"><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/';
const STATS = 'https://site.web.api.espn.com/apis/common/v3/sports/hockey/nhl/statistics/byathlete';
const STAND = 'https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings';
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* Réglages du modèle */
const M = {
  DOM: 1.04,          // petit avantage à domicile
  K_EQ: 10,           // matchs pour lisser l'attaque/défense d'une équipe
  K_J: 8,             // matchs pour lisser les stats d'un joueur
  PRIOR: { F: { g: 0.20, a: 0.28 }, D: { g: 0.06, a: 0.24 } },
  MIN_MJ: 3,          // matchs joués minimum pour être proposé
  MARGE: 1.05         // cote minimum = juste prix + 5 %
};

let S = { jour: 0, tab: 'top', seg: 'd', nb: 1, data: {}, joueurs: null, eq: null, bless: null, t: 0 };

const jourUS = dec => {      // date des matchs NHL (heure de New York), décalée de dec jours
  const d = new Date(Date.now() + dec * 864e5);
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  return p.replace(/-/g, '');
};
const heure = iso => new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const dateCourte = iso => new Date(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const pc = p => Math.round(p * 100) + ' %';
const cote = p => (1 / p * M.MARGE).toFixed(2).replace('.', ',');
const getJ = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };

/* ---------- Chargement des données ---------- */
async function chargerBase(force) {
  const cache = store.get('ph_base');
  if (!force && cache && Date.now() - cache.t < 3 * 3600e3) { Object.assign(S, cache.v); return; }
  const [p1, p2, st, inj] = await Promise.all([
    getJ(STATS + '?limit=500&sort=offensive.points:desc'),
    getJ(STATS + '?limit=500&sort=offensive.points:desc&page=2').catch(() => null),
    getJ(STAND),
    getJ(ESPN + 'injuries').catch(() => ({ injuries: [] }))
  ]);
  // joueurs
  const idx = {};
  (p1.categories || []).forEach(c => idx[c.name] = c.names);
  const val = (a, cat, nm) => { const c = (a.categories || []).find(x => x.name === cat); const i = idx[cat] ? idx[cat].indexOf(nm) : -1; return c && i >= 0 ? (c.totals || c.values)[i] : null; };
  const joueurs = [];
  [p1, p2].filter(Boolean).forEach(pg => (pg.athletes || []).forEach(a => {
    const at = a.athlete || {}, pos = (at.position || {}).abbreviation || '';
    if (pos === 'G') return;
    const toi = String(val(a, 'general', 'timeOnIcePerGame') || '0:00').split(':');
    joueurs.push({
      id: String(at.id), nom: at.displayName, court: at.shortName || at.displayName, eq: String(at.teamId), eqAb: at.teamShortName || '',
      pos, D: pos === 'D',
      mj: +val(a, 'general', 'games') || 0, b: +val(a, 'offensive', 'goals') || 0, a: +val(a, 'offensive', 'assists') || 0,
      ppb: +val(a, 'offensive', 'powerPlayGoals') || 0, tirs: +val(a, 'offensive', 'shotsTotal') || 0,
      toi: (+toi[0] || 0) + (+toi[1] || 0) / 60
    });
  }));
  // équipes : buts pour / contre
  const eq = {};
  const entrees = [];
  const parcourir = n => { if (!n) return; if (n.standings && n.standings.entries) entrees.push(...n.standings.entries); (n.children || []).forEach(parcourir); };
  parcourir(st);
  entrees.forEach(e => {
    const v = {}; (e.stats || []).forEach(s => v[s.name] = s.value);
    eq[String(e.team.id)] = { ab: e.team.abbreviation, nom: e.team.displayName, mj: v.gamesPlayed || 0, bp: v.pointsFor || 0, bc: v.pointsAgainst || 0, v: v.wins || 0, d: v.losses || 0, dp: v.otLosses || 0 };
  });
  // blessés
  const bless = {};
  (inj.injuries || []).forEach(t => (t.injuries || []).forEach(x => {
    const a = x.athlete || {};
    let id = a.id; if (!id) { const l = (a.links || []).map(l => l.href).join(' ').match(/\/id\/(\d+)/); id = l && l[1]; }
    const k = id ? String(id) : 'n:' + a.displayName;
    bless[k] = { st: x.status || '', txt: x.shortComment || '' };
    bless['n:' + a.displayName] = bless[k];
  }));
  const v = { joueurs, eq, bless };
  Object.assign(S, v);
  store.set('ph_base', { t: Date.now(), v });
}
async function chargerJour(dec, force) {
  const d = jourUS(dec);
  if (!force && S.data[d] && Date.now() - S.data[d].t < 60e3) return S.data[d].ev;
  const j = await getJ(ESPN + 'scoreboard?dates=' + d);
  const ev = (j.events || []).map(e => {
    const c = e.competitions[0], cs = c.competitors;
    const dom = cs.find(x => x.homeAway === 'home'), ext = cs.find(x => x.homeAway === 'away');
    const eqI = x => ({ id: String(x.team.id), ab: x.team.abbreviation, nom: x.team.shortDisplayName || x.team.displayName, logo: x.team.logo, score: x.score, rec: ((x.records || [])[0] || {}).summary || '' });
    return { id: e.id, date: e.date, etat: e.status.type.state, detail: e.status.type.shortDetail, dom: eqI(dom), ext: eqI(ext) };
  });
  S.data[d] = { t: Date.now(), ev };
  return ev;
}

/* ---------- Modèle ---------- */
function moyLigue() {
  let b = 0, m = 0; Object.values(S.eq).forEach(e => { b += e.bp; m += e.mj; });
  return m ? b / m : 3.0;
}
function forceEq(id, G) {
  const e = S.eq[id]; if (!e || !e.mj) return { att: 1, def: 1, bpm: G };
  const w = e.mj / (e.mj + M.K_EQ);
  return { att: 1 + w * (e.bp / e.mj / G - 1), def: 1 + w * (e.bc / e.mj / G - 1), bpm: (e.bp + G * M.K_EQ) / (e.mj + M.K_EQ) };
}
function statutBless(j) { return S.bless[j.id] || S.bless['n:' + j.nom] || null; }
function joueursMatch(m) {
  const G = moyLigue();
  const fD = forceEq(m.dom.id, G), fE = forceEq(m.ext.id, G);
  const lam = { [m.dom.id]: G * fD.att * fE.def * M.DOM, [m.ext.id]: G * fE.att * fD.def / M.DOM };
  const bpm = { [m.dom.id]: fD.bpm, [m.ext.id]: fE.bpm };
  const out = [];
  S.joueurs.forEach(j => {
    if (j.eq !== m.dom.id && j.eq !== m.ext.id) return;
    if (j.mj < M.MIN_MJ) return;
    const bl = statutBless(j);
    if (bl && !/day/i.test(bl.st)) return;          // blessé / réserve : écarté
    const pr = j.D ? M.PRIOR.D : M.PRIOR.F;
    const gpm = (j.b + pr.g * M.K_J) / (j.mj + M.K_J);
    const apm = (j.a + pr.a * M.K_J) / (j.mj + M.K_J);
    const k = lam[j.eq] / bpm[j.eq];                 // match plus ou moins prolifique que d'habitude
    const mb = gpm * k, ma = apm * k;
    const md = (mb + ma) * 0.93;
    out.push({ j, pB: auMoins(mb, 1), pA: auMoins(ma, 1), pD: auMoins(md, 1),
      pB2: auMoins(mb, 2), pA2: auMoins(ma, 2), pD2: auMoins(md, 2), pB3: auMoins(mb, 3), pA3: auMoins(ma, 3), pD3: auMoins(md, 3), incertain: !!bl, m,
      adv: j.eq === m.dom.id ? m.ext.ab : m.dom.ab });
  });
  return out;
}

/* Poisson : chance de faire au moins n fois (but, passe, point) */
function auMoins(mu, n) { let t = 0, f = 1; for (let i = 0; i < n; i++) { if (i) f *= mu / i; t += f; } return Math.max(0, 1 - Math.exp(-mu) * t); }
const TAG = { pB2: '2+ buts', pA2: '2+ passes', pD2: '2+ points', pB3: '3+ buts', pA3: '3+ passes', pD3: '3+ points' };
/* ---------- Affichage ---------- */
const ligne = (x, k) => {
  const p = x[k];
  return `<div class="pl m" data-m="${esc(x.m.id)}"><div class="n">${esc(x.j.nom)}${TAG[k] ? ` · <span style="color:var(--gold2)">${TAG[k]}</span>` : ''}${x.incertain ? '<span class="inc">incertain</span>' : ''}</div><div class="pc">${pc(p)}</div>
    <div class="d">${esc(x.j.eqAb)} vs ${esc(x.adv)} · ${heure(x.m.date)}</div><div class="co">joue si cote ≥ ${cote(p)}</div></div>`;
};
const chipsJour = () => `<div class="chips">${['Cette nuit', 'Nuit suivante'].map((t, i) => `<button class="chip${S.jour === i ? ' on' : ''}" data-jour="${i}">${t}</button>`).join('')}</div>`;
const LBL = { pB: ['Buteurs', 'marque au moins 1 but'], pA: ['Passeurs', 'fait au moins 1 passe décisive'], pD: ['Décisifs', 'but ou passe décisive'] };

function vueTop(ev) {
  const avenir = ev.filter(m => m.etat === 'pre');
  let h = chipsJour();
  if (!avenir.length) return h + `<p class="empty">${ev.length ? 'Tous les matchs de cette nuit ont commencé.' : 'Pas de match NHL cette nuit.'}<br>Regarde la nuit suivante.</p>`;
  const tous = avenir.flatMap(joueursMatch).filter(x => !x.incertain);
  const top = (k, n) => tous.slice().sort((a, b) => b[k] - a[k]).slice(0, n);
  h += `<div class="card hero"><div class="tt">🏒 Les paris joueurs du jour</div><div class="st">${avenir.length} match${avenir.length > 1 ? 's' : ''} · les joueurs les plus probables</div>
    <div class="sec">⭐ Joueurs décisifs (but ou passe)</div>${top('pD', 3).map(x => ligne(x, 'pD')).join('')}
    <div class="sec">🎯 Buteurs</div>${top('pB', 3).map(x => ligne(x, 'pB')).join('')}
    <div class="sec">🅰️ Passeurs</div>${top('pA', 3).map(x => ligne(x, 'pA')).join('')}
    <div class="sec">🔥 Plusieurs fois dans le match (points = buts + passes)</div>${top('pD2', 3).map(x => ligne(x, 'pD2')).join('')}${top('pB2', 2).map(x => ligne(x, 'pB2')).join('')}${top('pA2', 2).map(x => ligne(x, 'pA2')).join('')}
    <p class="note">💡 Joue un pari seulement si la cote du bookmaker est au moins égale à la « cote ≥ » affichée, avec 1 à 2 % de ta bankroll. Vérifie avant le match que le joueur est bien aligné.</p></div>`;
  return h;
}
function vueMatchs(ev) {
  let h = chipsJour();
  if (!ev.length) return h + '<p class="empty">Pas de match NHL ce jour-là.</p>';
  h += '<div class="grid2">';
  ev.forEach(m => {
    const js = joueursMatch(m).filter(x => !x.incertain);
    const best = k => js.slice().sort((a, b) => b[k] - a[k])[0];
    const live = m.etat !== 'pre';
    const eqH = (t, r) => `<div class="team${r ? ' r' : ''}">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}<div style="min-width:0"><div class="nm">${esc(t.nom)}</div><div class="rec">${esc(t.rec)}</div></div></div>`;
    h += `<div class="card m" data-m="${esc(m.id)}"><div class="meta"><span>${dateCourte(m.date)}</span><span class="heure">${live ? esc(m.detail) : heure(m.date)}</span></div>
      <div class="teams">${eqH(m.ext)}<div class="vs${live ? ' live' : ''}">${live ? esc(m.ext.score) + ' - ' + esc(m.dom.score) : '@'}</div>${eqH(m.dom, 1)}</div>`;
    if (js.length) h += `<div class="mini">${['pD', 'pB', 'pA'].map(k => { const x = best(k); return `<div><span>${LBL[k][0].slice(0, -1)}</span><b>${esc(x.j.court)} (${esc(x.j.eqAb)})</b><i>${pc(x[k])}</i></div>`; }).join('')}</div>`;
    h += `<button class="more">Voir tous les joueurs</button></div>`;
  });
  return h + '</div>';
}
function vueJoueurs(ev) {
  let h = chipsJour();
  const avenir = ev.filter(m => m.etat === 'pre');
  if (!avenir.length) return h + '<p class="empty">Aucun match à venir ce jour-là.</p>';
  const k0 = { b: 'pB', a: 'pA', d: 'pD' }[S.seg], k = k0 + (S.nb > 1 ? S.nb : '');
  const tous = avenir.flatMap(joueursMatch).sort((a, b) => b[k] - a[k]).slice(0, 40);
  const mot = { b: ['but', 'buts'], a: ['passe décisive', 'passes décisives'], d: ['point (but ou passe)', 'points (buts ou passes)'] }[S.seg];
  h += `<div class="seg">${[['d', 'Décisifs'], ['b', 'Buteurs'], ['a', 'Passeurs']].map(([v, t]) => `<button data-seg="${v}" class="${S.seg === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  h += `<div class="chips">${[1, 2, 3].map(n => `<button class="chip${S.nb === n ? ' on' : ''}" data-nb="${n}">${n === 1 ? '1 fois ou +' : n + ' fois ou +'}</button>`).join('')}</div>`;
  h += `<div class="card"><div class="st" style="color:var(--muted);font-size:12.5px">Chance qu'il fasse au moins ${S.nb} ${S.nb > 1 ? mot[1] : mot[0]} · tous les matchs à venir</div>${tous.map(x => ligne(x, k)).join('')}</div>`;
  return h;
}
function ficheMatch(m) {
  const js = joueursMatch(m);
  const tab = (k) => {
    const l = js.slice().sort((a, b) => b[k] - a[k]).slice(0, 12);
    return `<table><thead><tr><th class="eq">Joueur</th><th>Éq.</th><th>B</th><th>P</th><th>1+ %</th><th>2+ %</th><th>3+ %</th></tr></thead><tbody>${l.map(x =>
      `<tr><td class="eq">${esc(x.j.court)}${x.incertain ? '<span class="inc">?</span>' : ''}</td><td>${esc(x.j.eqAb)}</td><td>${x.j.b}</td><td>${x.j.a}</td><td class="g">${Math.round(x[k] * 100)}</td><td class="g">${Math.round(x[k + '2'] * 100)}</td><td>${Math.round(x[k + '3'] * 100)}</td></tr>`).join('')}</tbody></table>`;
  };
  const corps = () => `<div class="seg">${[['d', 'Décisifs'], ['b', 'Buteurs'], ['a', 'Passeurs']].map(([v, t]) => `<button data-fseg="${v}" class="${S.seg === v ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div class="sub">% de chances qu'il le fasse 1, 2 ou 3 fois ou plus · B et P = buts et passes cette saison</div>${tab({ b: 'pB', a: 'pA', d: 'pD' }[S.seg])}
    <p class="note">Cote minimum à viser : 100 ÷ % × 1,05 (ex. 25 % → joue si cote ≥ 4,20). « ? » = joueur incertain (blessure légère). Le modèle ne connaît pas la composition du soir : vérifie que le joueur est aligné avant de parier.</p>`;
  ouvrir(`<h3>${esc(m.ext.nom)} @ ${esc(m.dom.nom)}</h3><div class="sub">${dateCourte(m.date)} · ${heure(m.date)}</div><div id="fc">${corps()}</div>`);
  $('#sheet').onclick = e => { const b = e.target.closest('[data-fseg]'); if (b) { S.seg = b.dataset.fseg; $('#fc').innerHTML = corps(); } };
}
function ouvrir(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#veil').classList.remove('hidden'); }
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil' || e.target.classList.contains('grab')) $('#veil').classList.add('hidden'); });

async function rendre() {
  const ev = await chargerJour(S.jour);
  const v = { top: vueTop, matchs: vueMatchs, joueurs: vueJoueurs }[S.tab];
  $('#view').innerHTML = v(ev);
  const t = store.get('ph_base');
  $('#maj').textContent = t ? 'Stats joueurs mises à jour à ' + new Date(t.t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
}
$('#view').addEventListener('click', e => {
  const c = e.target.closest('[data-jour]'); if (c) { S.jour = +c.dataset.jour; return rendre(); }
  const s = e.target.closest('[data-seg]'); if (s) { S.seg = s.dataset.seg; return rendre(); }
  const nb = e.target.closest('[data-nb]'); if (nb) { S.nb = +nb.dataset.nb; return rendre(); }
  const m = e.target.closest('[data-m]');
  if (m) { const d = S.data[jourUS(S.jour)]; const mm = d && d.ev.find(x => x.id === m.dataset.m); if (mm) ficheMatch(mm); }
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  window.scrollTo(0, 0); rendre();
});
async function demarrer(force) {
  $('#btnRefresh').classList.add('spin');
  try { await chargerBase(force); await chargerJour(S.jour, force); await rendre(); }
  catch (e) { $('#view').innerHTML = `<p class="empty">Impossible de charger les données NHL.<br>Vérifie ta connexion puis appuie sur ↻.</p>`; }
  $('#btnRefresh').classList.remove('spin');
}
$('#btnRefresh').addEventListener('click', () => demarrer(true));
setInterval(() => { if (!document.hidden && S.tab === 'matchs') chargerJour(S.jour, true).then(rendre).catch(() => {}); }, 60e3);
demarrer(false);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
